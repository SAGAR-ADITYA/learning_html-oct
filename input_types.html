<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
</head>
<body>
    <h2>All Input Types In Html</h2>
    <form>
        <label>First Name :</label>
        <input type="text" placeholder="Enter Your Name" />
        ,<br><br>
        <label>Last Name :</label>
        <input type="text" placeholder="Enter Last Name" />
        <br><br>
        <label>Email:</label>
        <input type="email" placeholder="Enter Email"/>
        <br><br>
        <label>Enter Fax Number:</label>
        <input type="number" placeholder="Enter number"/>
        <br>
        <br>

        <label>DOB :</label>
        <input type="date" />
        <br>
        <br>
        <label>Select Month:</label>
        <input type="month"/>
        <br>
         <br>
        <label>Select Week:</label>
        <input type="week" />
        <br>
         <br>
        <label>Select Time</label>
        <input type="time" />
        <br>
         <br>
        <label>Select Date and Time</label>
        <input type="datetime-local"/>
        <br>
        <br>
        <label>Choose  City :</label>
        <input type="Checkbox"/ checked>pune
        <input type="checkbox"/>mumbai
        <input type="checkbox"/>delhi

        <br>
        <br>

        <label>Select Gender :</label>
        <input type="radio" name="gender"/>Male
        <input type="radio" name="gender"/>Female
        <input type="radio" name="gender"/>Other
        <br>
        <br>
        <label>choose Color :</label>
        <input type="color" />
        <br>
        <br>
        <label>Select Range :</label>
        <input type="range"  min="0" max="10" />
        <br>
        <br>
        <label>Choose File :</label>
        <input type="file" multiple/>
        <br>
        <label>Enter Password:</label>
        <input type="password" placeholder="Enter Password"/>
        <br>
        <br>
        <label>Search :</label>
        <input type="search" placeholder="search..."/>
        <br>
        <br>
        <label>Enter url :</label>
        <input type="url" placeholder="@gmail.com"/>
        <br>
        <br>
        <label>Enter Phone number :</label>
        <input type="tel" placeholder="number"/>
        <br>
        <br>
        <label>Select Country :</label>
        <select placeholder="select..">
            <option>select</option>
            <option>India</option>
            <option>Japan</option>
            <option>Shrilanka</option>
            <option>USA</option>
            <option>Canada</option>
        </select>
        <br>
        <br>

        <label>Enter Address :
        
        </label>
        <br>
        <textarea placeholder="Enter address" rows="5" cols="40"></textarea>
        <br>
        <br>

        <input type="submit" value="submit"/>
        <input type="button" value="refresh"/>
        <input type="reset" value="reset"/>
        
        


    </form>

    
</body>
</html>
